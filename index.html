<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGIS Mangrove Kepulauan Seribu</title>
<meta name="description" content="Perkembangan data dan hasil analisis Kajian Pemulihan Ekosistem Mangrove di Kepulauan Seribu 2026">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%231f5f4a'/><path d='M16 6c-5 4-6 9-4 14m4-14c5 4 6 9 4 14M16 6v20M9 26h14' stroke='%23e8f1ec' stroke-width='2' fill='none'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="kode">MGV-KS</span>
    <div>
      <h1>Kajian Pemulihan Ekosistem Mangrove di Kepulauan Seribu</h1>
      <p class="sub">WebGIS perkembangan data &amp; hasil analisis · <span id="tgl-update"></span></p>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="progres" class="active">Progres</button>
    <button role="tab" data-tab="pulau">Per pulau</button>
    <button role="tab" data-tab="analisis">Analisis</button>
    <button role="tab" data-tab="tabel">Tabel</button>
    <button role="tab" data-tab="info">Tentang</button>
  </nav>
</header>

<main class="layout">
  <aside class="panel" id="panel">
    <section class="tab-pane active" id="tab-progres"></section>
    <section class="tab-pane" id="tab-pulau"></section>
    <section class="tab-pane" id="tab-analisis"></section>
    <section class="tab-pane" id="tab-tabel"></section>
    <section class="tab-pane" id="tab-info"></section>
  </aside>
  <div class="mapwrap">
    <div id="map"></div>
    <div class="layerbox" id="layerbox"></div>
    <div class="legend" id="legend"></div>
    <button class="panel-toggle" id="panel-toggle" aria-label="Tampilkan/sembunyikan panel">☰</button>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
